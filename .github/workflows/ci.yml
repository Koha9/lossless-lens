name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Keep PR feedback current without cancelling a release that calls this workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LOSSLESS_LENS_REAL_AI: '0'
      LOSSLESS_LENS_EXTERNAL_ACTIONS: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Protect the disposable CI checkout
        shell: bash
        run: |
          git config --local remote.origin.pushurl DISABLED
          git config --local core.hooksPath .githooks
      - name: Python, JavaScript and application checks
        run: python scripts/project_check.py

  package:
    name: Windows package
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install application dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Build ZIP and check executable startup
        shell: pwsh
        run: ./build_onedir.ps1 -Zip
      - uses: actions/upload-artifact@v7
        with:
          name: LosslessLens-windows-x64
          path: dist/LosslessLens-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
